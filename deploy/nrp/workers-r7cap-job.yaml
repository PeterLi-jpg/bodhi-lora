# The workers of the MedGemma-27B evals at a 4,096-token cap (ANALYSIS_PLAN.md section 12,
# the 2026-10-25 entry; docs/NRP.md section 5): scripts/task_pool.py on
# configs/queues/r7cap_nrp.yaml with the state folder /data/pool/r7cap, one A100-80GB per
# pod. It starts with one pod while the R7 Job still holds two cards (the BODHI budget is
# three); when that Job ends, `kubectl patch job bodhi-lora-workers-r7cap -p
# '{"spec":{"parallelism":2}}'` lets a second pod queue. Three models only (MedGemma-27B, the
# evaluator Llama-3.1-8B and the judge Phi-4), and requests near what an R7 worker used (about
# one CPU, up to 66 GiB while vLLM loads), so the account stays above NRP's 20% floor.
apiVersion: batch/v1
kind: Job
metadata:
  name: bodhi-lora-workers-r7cap
  labels: {app: bodhi-lora}
spec:
  parallelism: 1                 # two while the R7 Job holds two cards would pass the budget
  completions: 2
  backoffLimit: 8                # a pod that fails (exit 75: card in use) is replaced
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {app: bodhi-lora}
    spec:
      restartPolicy: Never
      # task_pool gives a stopped task 120 s to stop its vLLM server
      terminationGracePeriodSeconds: 180
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: [NVIDIA-A100-SXM4-80GB, NVIDIA-A100-80GB-PCIe]
      containers:
        - name: worker
          image: vllm/vllm-openai:v0.10.2
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: HF_TOKEN
              valueFrom: {secretKeyRef: {name: nfootprint-hf, key: token}}
            - {name: HF_HOME, value: /local/hf}
            - {name: XDG_CACHE_HOME, value: /local/cache}
            - {name: VLLM_CACHE_ROOT, value: /local/cache/vllm}
            - {name: TRITON_CACHE_DIR, value: /local/cache/triton}
            - {name: PYTHONUNBUFFERED, value: "1"}
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              # The envs, at the paths .venv and .venv-infer link to (deploy/nrp/setup-job.yaml).
              for env in train infer; do
                [ -x "/local/venv-$env/bin/python" ] || tar -xf "/data/venvs/venv-$env.tar" -C /local
              done
              cd /data/bohdi
              source .venv/bin/activate
              STATE=/data/pool/r7cap
              POOL="python scripts/task_pool.py --dag configs/queues/r7cap_nrp.yaml --state $STATE --repo /data/bohdi"
              echo "=== $POD_NAME $(date -u +%FT%TZ) on $(cat /etc/hostname) $(nvidia-smi --query-gpu=name,memory.total --format=csv,noheader)"
              # A pod that would find nothing to run stops before it downloads the models.
              # Only exit 3 means that; any other failure of the check fails the pod, so the
              # Job replaces it instead of counting it as done.
              rc=0; $POOL --has-work || rc=$?
              if [ "$rc" = 3 ]; then echo "no task for this pod; done"; exit 0; fi
              [ "$rc" = 0 ] || { echo "the work check failed (exit $rc)"; exit "$rc"; }
              # The three models these evals load, at the revisions of their records, to this
              # pod's disk. The duplicate full-model files are left out: vLLM and
              # transformers load the shards that model.safetensors.index.json lists.
              python - <<'PY'
              import yaml
              from huggingface_hub import snapshot_download
              for mid in ("medgemma-27b-text", "llama-3.1-8b", "phi-4"):
                  rec = yaml.safe_load(open(f"configs/models/{mid}.yaml"))
                  path = snapshot_download(rec["hf_id"], revision=rec["revision"], max_workers=16,
                                           ignore_patterns=["consolidated*", "original/*", "*.pth", "*.gguf"])
                  print("model", mid, rec["revision"][:10], path, flush=True)
              PY
              export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
              exec $POOL
          resources:
            requests: {nvidia.com/a100: "1", cpu: "4", memory: 64Gi, ephemeral-storage: 150Gi}
            limits: {nvidia.com/a100: "1", cpu: 4800m, memory: 76Gi, ephemeral-storage: 180Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: local, mountPath: /local}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: bodhi-lora-rerun}
        - name: local
          emptyDir: {sizeLimit: 170Gi}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 16Gi}
