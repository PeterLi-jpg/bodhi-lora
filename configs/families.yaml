# Model registry: the family, the pinned HF revision and the chat-template facts
# for every model that a launcher or a config can name.
#
# family
#   The pretraining lineage of the model. rebuttal/launch/run_cell.sh refuses a
#   cell whose base model is in the same family as the trace filter or the
#   evaluator, unless --allow-same-family is passed (the manifest records it).
#   bodhi_lora/pipeline/grade.py refuses a judge from the filter family, the
#   evaluator family or the family of the graded base model.
#
# revision
#   The HF commit that a run loads. bodhi_lora/manifest.py:pinned_revision()
#   reads it, and every entry point passes it to vLLM (--revision) and to
#   from_pretrained(revision=...). A --*-revision flag or a config
#   model.revision overrides it.
#   Each value is the repo HEAD read from https://huggingface.co/api/models/<id>
#   on 2026-10-07. last_modified is the date of that commit. Every date is
#   earlier than the first run that used the model (submitted MedGemma cell:
#   2026-05-01 to 2026-05-04; rebuttal cells: 2026-07-23 to 2026-08-25). A run
#   that loaded the repo at HEAD therefore loaded this commit, because a hub
#   repo only moves forward with new commits.
#   null means the revision could not be read (gated or private repo). Such a
#   run loads HEAD, and its manifest records the revision as unpinned.
#
# system_role
#   false when the chat template raises on a system message. The prompt
#   baselines then put their instructions at the top of the first user turn.
#
# A model that is not listed here has no family, so the guard refuses it.
# Add the model here first.

roles:
  filter: Qwen/Qwen2.5-14B-Instruct
  evaluator: meta-llama/Llama-3.1-8B-Instruct
  # Default judge for bodhi_lora/pipeline/grade.py. It is outside the filter
  # and evaluator families, and outside the Llama-3 family of the Med42 cells.
  cross_family_judge: google/gemma-2-27b-it

