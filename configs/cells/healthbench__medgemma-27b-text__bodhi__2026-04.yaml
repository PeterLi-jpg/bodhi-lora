# A pilot run before the submitted cell. It trained on 800 Hard prompts (only its 200 eval
# ids were held out) and was graded by the filter grader, so it enters no table. The paper
# uses one number from it: the seed-42 scores under the Qwen grader, as a cross-grader
# check. Its trace and filter settings were not kept; the recipe below is read from the
# adapter's saved training arguments (train/training_args.bin).
id: healthbench__medgemma-27b-text__bodhi__2026-04
benchmark: healthbench
split: pilot
model: medgemma-27b-text
protocol: bodhi
seeds: [42]
grading:
  filter: qwen2.5-14b
  evaluator: qwen2.5-14b
  same_family_waiver: A pilot run before the asymmetric grading design; the filter grader also graded the eval.
train:
  engine: peft
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, v_proj]
  epochs: 5
  per_device_batch: 1
  grad_accum: 64
  effective_batch: 64
  lr: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.05
  max_seq_length: 1024
  gradient_checkpointing: false
  checkpoint: best_val_loss
  eval_every: epoch
  logging_steps: 5
  hardware: not recorded
eval:
  conditions: [base, base+bodhi, lora]
  # 02ac9a3:data/raw/hard_200_sample_ids.json, in the cell's shared/inputs folder.
  ids: {policy: fixed_file, n: 200, file: eval_ids.json}
  base_precision: model
  max_new_tokens: 1024
  max_new_tokens_per_pass: 2048
  # The eval code at e0e0fce (2026-04-27, the last change before the run): context 4,096,
  # 16 client threads, a 180 s timeout and a 30 s drain. It passed no scheduler limit, so
  # vLLM used its own default; 256 is that default in the 0.6 to 0.9 releases, and the
  # version that ran was not recorded.
  serving: {max_model_len: 4096, max_num_seqs: 256, concurrency: 16, request_timeout_s: 180, drain_s: 30}
report:
  label: HealthBench-Hard pilot, MedGemma-27B
  token: HBMedGemmaApr
  status: pilot
  notes: 2,999 raw traces, 838 train and 93 val rows; the conditions ran on 200 prompts graded by the filter grader.
