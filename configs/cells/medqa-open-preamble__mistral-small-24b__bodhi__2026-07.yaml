# A cell added in the 2026-07 discussion. It ran 61dada9:rebuttal/launch/run_cell.sh;
# legacy/README.md section 7 lists how its settings differ from the 2026-05 cell.
id: medqa-open-preamble__mistral-small-24b__bodhi__2026-07
benchmark: medqa-open-preamble
split: head
model: mistral-small-24b
protocol: bodhi
seeds: [42, 7, 13, 99, 101]
grading:
  filter: qwen2.5-14b
  evaluator: llama-3.1-8b-nous
  # E10, the clinical judge panel: MedGemma-27B-text, a clinical model outside the
  # Qwen and Llama families and the base's family. Run:
  #   python -m bodhi_lora run medqa-open-preamble__mistral-small-24b__bodhi__2026-07 --stages grade --judges medgemma-27b-text --gpus 0
  judges: [medgemma-27b-text]
traces:
  max_prompts: 4200
  max_new_tokens_per_pass: 2048
  serving: {max_model_len: 8192, max_num_seqs: 64, concurrency: 32, request_timeout_s: 180}
filter:
  # The launcher's rule for non-HealthBench cells: tau 0.4, then the 22nd-percentile tau
  # when the train split kept less than 40% of the raw traces. No cell met it
  # (results/cross_cell/cell_recipe.json).
  tau: {rule: fixed_then_percentile, value: 0.4, percentile: 22, min_kept_share: 0.4}
  val_ratio: 0.1
  # One train/val split for every seed.
  split_policy: once
  split_seed: 42
  serving: {max_model_len: 8192, max_num_seqs: 64, concurrency: 16, request_timeout_s: 180}
train:
  engine: peft
  # QLoRA: NF4 weights with bf16 compute and double quantization.
  quantization: 4bit
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  epochs: 3
  per_device_batch: 2
  grad_accum: 8
  effective_batch: 16
  lr: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.05
  max_seq_length: 4096
  gradient_checkpointing: true
  checkpoint: best_val_loss
  eval_every: epoch
  logging_steps: 10
  hardware: 1x H100 80GB
eval:
  conditions: [base, base+bodhi, lora, lora+bodhi]
  # The eval pool of the split, one fixed set for every seed, in shared/inputs.
  ids: {policy: fixed_file, n: 200, file: eval_ids.json}
  base_precision: model
  base_precision_reason: The run served the base in bf16, so the adapter trained on a 4-bit base was evaluated on a bf16 base (audit REPRO-12).
  max_new_tokens: 1024
  max_new_tokens_per_pass: 2048
  serving: {max_model_len: 8192, max_num_seqs: 64, concurrency: 16, request_timeout_s: 180, drain_s: 30}
# E11: does the base continue this benchmark's eval prompts verbatim more often than
# HealthBench prompts? HealthBench appeared in May 2025, after this base, so it
# cannot be in its pretraining and gives the rate of recall by chance. The eval pool
# has 200 rows, so 100 are probed.
# The setting of the paper's Appendix A: 15 + 25 tokens. Run:
#   python -m bodhi_lora run medqa-open-preamble__mistral-small-24b__bodhi__2026-07 --stages probe --gpus 0
probe:
  control: healthbench
  n_prompts: 100
  prefix_tokens: 15
  continuation_tokens: 25
  serving: {max_model_len: 8192, max_num_seqs: 64, concurrency: 32, request_timeout_s: 180}
report:
  label: MedQA with the asking preamble, Mistral-Small-24B
  token: MedQAPreMistralJul
  status: complete
  set_aside: The prompt preamble told the model to ask, so the cell measured instruction-following (withdrawals W12).
