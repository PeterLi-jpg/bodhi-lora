# The smoke cell. `make smoke` runs every stage on the CPU: the stub engine answers for
# vLLM, and the tiny random model trains for real, so a change that breaks a stage fails
# here before it reaches a GPU. Its numbers mean nothing.
id: tiny-rubric__tiny-random-llama__bodhi
benchmark: tiny-rubric
model: tiny-random-llama
protocol: bodhi
seeds: [1, 2]
grading:
  filter: qwen2.5-14b
  evaluator: llama-3.1-8b
traces:
  max_prompts: 12
  max_new_tokens_per_pass: 64
  serving: {max_model_len: 1024, max_num_seqs: 4, concurrency: 4, request_timeout_s: 60}
filter:
  tau: {rule: fixed, value: 0.4}
  val_ratio: 0.2
  split_policy: per_seed
  serving: {max_model_len: 1024, max_num_seqs: 4, concurrency: 4, request_timeout_s: 60}
train:
  engine: peft
  r: 4
  alpha: 8
  dropout: 0.0
  target_modules: [q_proj, v_proj]
  max_steps: 2
  per_device_batch: 2
  grad_accum: 1
  effective_batch: 2
  lr: 1.0e-3
  scheduler: constant
  max_seq_length: 256
  checkpoint: last
  eval_every: steps
  eval_steps: 1
  logging_steps: 1
  hardware: CPU
eval:
  conditions: [base, base+bodhi, lora, lora+bodhi, base+clarify]
  ids: {policy: per_seed_draw, n: 4}
  base_precision: model
  max_new_tokens: 64
  max_new_tokens_per_pass: 64
  serving: {max_model_len: 1024, max_num_seqs: 4, concurrency: 4, request_timeout_s: 60}
# The probe runs on the stub engine's word tokenizer; the control is the same fixture.
probe:
  control: tiny-rubric
  n_prompts: 4
  prefix_tokens: 3
  continuation_tokens: 3
  serving: {max_model_len: 1024, max_num_seqs: 4, concurrency: 4, request_timeout_s: 60}
report:
  label: Smoke test
  token: Smoke
  status: planned
