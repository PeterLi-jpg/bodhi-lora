# E24, the general twin of MedGemma-27B (optional). Accept the Gemma license on Hugging
# Face first.
# Run: python -m bodhi_lora run healthbench__gemma-3-27b__bodhi --gpus 0,1,2,3,4
id: healthbench__gemma-3-27b__bodhi
benchmark: healthbench
split: default
model: gemma-3-27b
protocol: bodhi
seeds: [42, 7, 13, 99, 101]
grading:
  filter: qwen2.5-14b
  evaluator: llama-3.1-8b
  judges: [phi-4]
traces:
  max_prompts: 4200
  max_new_tokens_per_pass: 2048
  serving: {max_model_len: 8192, max_num_seqs: 64, concurrency: 32, request_timeout_s: 180}
filter:
  tau: {rule: fixed, value: 0.4}
  split_policy: per_seed
  serving: {max_model_len: 8192, max_num_seqs: 64, concurrency: 16, request_timeout_s: 180}
train:
  engine: peft
  # QLoRA: NF4 weights with bf16 compute and double quantization, to fit one H100.
  quantization: 4bit
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  epochs: 3
  per_device_batch: 2
  grad_accum: 8
  effective_batch: 16
  lr: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.05
  max_seq_length: 4096
  gradient_checkpointing: true
  checkpoint: best_val_loss
  eval_every: epoch
  logging_steps: 10
  hardware: 1x H100 80GB
eval:
  conditions: [base, base+bodhi, lora, lora+bodhi]
  ids: {policy: per_seed_draw, n: 200}
  # The base is served as it was trained, 4-bit under a QLoRA adapter (audit REPRO-12).
  base_precision: train
  max_new_tokens: 1024
  max_new_tokens_per_pass: 2048
  serving: {max_model_len: 8192, max_num_seqs: 32, concurrency: 32, request_timeout_s: 900}
# E11: does the base continue this benchmark's eval prompts verbatim more often than
# ChatDoctor questions (a public 2023 set)? HealthBench appeared in May 2025,
# after this base, so it cannot be in its pretraining: here the probe checks that the
# method finds no recall where none is possible. The setting of the paper's Appendix A: 15 + 25 tokens, 200 prompts.
probe:
  control: chatdoctor
  n_prompts: 200
  prefix_tokens: 15
  continuation_tokens: 25
  serving: {max_model_len: 8192, max_num_seqs: 64, concurrency: 32, request_timeout_s: 180}
report:
  label: HealthBench-Hard, Gemma-3-27B
  token: HBGemmaThree
  status: planned
