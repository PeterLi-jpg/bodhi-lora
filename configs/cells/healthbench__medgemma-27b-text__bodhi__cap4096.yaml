# The R7 adapters (healthbench__medgemma-27b-text__bodhi) again at a 4,096-token cap
# (ANALYSIS_PLAN.md section 12, the 2026-10-25 entry): the 1,024-token cap stopped 42% of
# R7's Base and 18% of its LoRA replies. Same seeds, draw rule, prompts, serving and graders
# as R7. The conditions are the ones the cap can change (no protocol or a prompt protocol)
# and the partners the plan's questions contrast with them here (H1, H2, H4, H6, E02).
# The request timeout is longer than R7's, because a reply can be four times as long.
# Run: python -m bodhi_lora run healthbench__medgemma-27b-text__bodhi__cap4096 --gpus 0
id: healthbench__medgemma-27b-text__bodhi__cap4096
benchmark: healthbench
split: default
model: medgemma-27b-text
protocol: bodhi
seeds: [42, 7, 13, 99, 101]
adapters_from: healthbench__medgemma-27b-text__bodhi
grading:
  filter: qwen2.5-14b
  evaluator: llama-3.1-8b
  judges: [phi-4]
eval:
  conditions: [base, lora, lora+bodhi, base+clarify, base+verbalized-confidence,
               base+mediq-abstain, lora+red-flags-first]
  ids: {policy: per_seed_draw, n: 200}
  # The base is served as it was trained, 4-bit under a QLoRA adapter (audit REPRO-12).
  base_precision: train
  max_new_tokens: 4096
  max_new_tokens_per_pass: 2048
  serving: {max_model_len: 8192, max_num_seqs: 32, concurrency: 32, request_timeout_s: 3600}
report:
  label: HealthBench-Hard, MedGemma-27B, 4,096-token cap
  token: HBMedGemmaCap
  status: planned
  # H6 (ANALYSIS_PLAN.md section 7.1): the primary contrast.
  contrasts:
    - lora+red-flags-first - lora+bodhi
