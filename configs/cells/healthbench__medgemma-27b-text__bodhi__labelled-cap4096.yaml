# healthbench__medgemma-27b-text__bodhi__labelled again at a 4,096-token cap
# (ANALYSIS_PLAN.md section 12, the 2026-10-25 entry): the 1,024-token cap stopped 56% of
# its Base and 29% of its LoRA replies. Same prompts, seeds, serving and graders. Base and
# LoRA only, the conditions of H7 and H11. The request timeout is longer, because a reply
# can be four times as long.
# Run: python -m bodhi_lora run healthbench__medgemma-27b-text__bodhi__labelled-cap4096 --gpus 0
id: healthbench__medgemma-27b-text__bodhi__labelled-cap4096
benchmark: healthbench
split: default
model: medgemma-27b-text
protocol: bodhi
seeds: [42, 7, 13, 99, 101]
adapters_from: healthbench__medgemma-27b-text__bodhi
grading:
  filter: qwen2.5-14b
  evaluator: llama-3.1-8b
eval:
  conditions: [base, lora]
  ids:
    policy: fixed_pool
    n: 775
    only:
      - {label: emergent-physician}
      - {label: clinician-user, groups: [positive]}
  # The base is served as it was trained, 4-bit under a QLoRA adapter (audit REPRO-12).
  base_precision: train
  max_new_tokens: 4096
  max_new_tokens_per_pass: 2048
  serving: {max_model_len: 8192, max_num_seqs: 32, concurrency: 32, request_timeout_s: 3600}
report:
  label: HealthBench labelled probes, MedGemma-27B, 4,096-token cap
  token: HBMedGemmaLabelledCap
  status: planned
