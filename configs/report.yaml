# The uniform analysis (docs/ARCHITECTURE.md section 7).
#
# python -m bodhi_lora analyze runs the same statistics on every cell; this file only
# names what is not a property of one cell: the labels the discrimination index uses,
# the cell groups the paper counts over, and the posted values to check. A new label or group is a change here, not in the code. The report
# (python -m bodhi_lora report, not built yet) adds its display names and tables here.

# Cells whose outputs are analyzed when they exist. A cell that never ran (not_run) or
# is only planned has nothing to read.
statuses: [complete, partial, pilot]

# One prompt-clustered bootstrap per cell: every pooled interval of the cell comes from
# the same resamples.
bootstrap: {resamples: 5000, seed: 0}

# No rule here reads the reply text. Until 2026-10-10 two keyword rules did (a
# second-person question rule and an emergency-mention rule); keyword rules miss
# negation, hypotheticals and quotes, so they were removed (docs/CONVENTIONS.md rule 15,
# docs/ANALYSIS_PLAN.md section 12). What a reply does comes from the evaluator's grades:
# active_inquiry for asking and red_flag_rate for red flags. A check by a judge from
# another family is planned, with a semantic rubric and a hand-label gate
# (ANALYSIS_PLAN.md section 12, 2026-10-10). tests/test_no_lexicon.py fails if a
# text rule comes back.

# The discrimination index: P(response | label positive) - P(response | label negative),
# for each listed label whose groups both occur among a cell's evaluated prompts, with the
# rate in each group. Only labels listed here are computed. The physician labels of the
# benchmark records are left out on purpose: the analysis plan keeps them unseen on every
# cell until its adoption (docs/ANALYSIS_PLAN.md, state at registration; convention 3).
# The two HealthBench labels read the theme tag only (configs/benchmarks/healthbench.yaml
# says why no other structured field can stand in), and both are post hoc (decision D9).
# `incomplete` is the label of the MediQ paired probe (configs/benchmarks/mediq-paired.yaml):
# it comes from how each pair was built, and its rule pairs the rows, so a cell on that
# benchmark also gets the paired statistics of ANALYSIS_PLAN.md section 5.1 (H3). No cell
# with that benchmark has run.
#   active_inquiry: does the reply ask more on prompts of the context_seeking theme, or on
#     the incomplete row of a pair than on the complete one.
#   red_flag_rate: the evaluator's red-flag rate (share of replies with red-flag score 2)
#     on prompts of the emergency_referrals theme and on the others. The rate on the
#     others counts warranted flags too, so it is not an over-flagging rate; the test of
#     over-flagging is H7 on the physician labels (ANALYSIS_PLAN.md section 7.2).
discrimination:
  - response: active_inquiry
    labels: [needs-info-theme, incomplete]
  - response: red_flag_rate
    labels: [emergency-theme]

# Response-length quartile edges come from this condition's scored replies.
length_reference: base

# The cells of the cross-cell statistics, in order.
cross_cells:
  - healthbench__medgemma-27b-text__bodhi__2026-05
  - healthbench__mistral-small-24b__bodhi__2026-07
  - healthbench__med42-8b__bodhi__2026-07
  - healthbench__biomistral-7b__bodhi__2026-07
  - chatdoctor__mistral-small-24b__bodhi__2026-07
  - chatdoctor__med42-8b__bodhi__2026-07
  - medquad__mistral-small-24b__bodhi__2026-07
  - medqa-open-preamble__mistral-small-24b__bodhi__2026-07

# Groups of cells that the paper counts over. A group is the cells of cross_cells that
# match every `where` key, minus `exclude`, or the cells it lists. Keys of where: status
# (list), model (list), family_waiver (true or false), set_aside (true or false). `token`
# names the group in macros. A group defined by a rule takes in every new cell of
# cross_cells that matches it, which is right for a statement about every cell. The
# groups of the cells added in the 2026-07 discussion list their cells, so a cell added
# later cannot change what the paper says about those.
groups:
  submitted:
    token: Submitted
    description: the cell of the submitted paper
    cells: [healthbench__medgemma-27b-text__bodhi__2026-05]
  set-aside:
    token: SetAside
    description: cells set aside, with the reason in their record
    where: {set_aside: true}
  outside-family:
    token: OutsideFamily
    description: complete cells outside the evaluator's family that are not set aside
    where: {status: [complete], family_waiver: false, set_aside: false}
  added:
    token: Added
    description: the complete cells added in the 2026-07 discussion
    cells: [healthbench__mistral-small-24b__bodhi__2026-07, healthbench__med42-8b__bodhi__2026-07,
            healthbench__biomistral-7b__bodhi__2026-07, chatdoctor__mistral-small-24b__bodhi__2026-07,
            chatdoctor__med42-8b__bodhi__2026-07, medquad__mistral-small-24b__bodhi__2026-07,
            medqa-open-preamble__mistral-small-24b__bodhi__2026-07]
  added-kept:
    token: AddedKept
    description: the added cells that are not set aside (the Holm family of the aggregate tests)
    cells: [healthbench__mistral-small-24b__bodhi__2026-07, healthbench__med42-8b__bodhi__2026-07,
            healthbench__biomistral-7b__bodhi__2026-07, chatdoctor__mistral-small-24b__bodhi__2026-07,
            chatdoctor__med42-8b__bodhi__2026-07, medquad__mistral-small-24b__bodhi__2026-07]
  added-outside-family:
    token: AddedOutsideFamily
    description: the added cells outside the evaluator's family that are not set aside
    cells: [healthbench__mistral-small-24b__bodhi__2026-07, healthbench__biomistral-7b__bodhi__2026-07,
            chatdoctor__mistral-small-24b__bodhi__2026-07, medquad__mistral-small-24b__bodhi__2026-07]
  added-mistral:
    token: AddedMistral
    description: the added Mistral-Small-24B cells
    cells: [healthbench__mistral-small-24b__bodhi__2026-07, chatdoctor__mistral-small-24b__bodhi__2026-07,
            medquad__mistral-small-24b__bodhi__2026-07, medqa-open-preamble__mistral-small-24b__bodhi__2026-07]
  added-med42:
    token: AddedMedFortyTwo
    description: the added Med42-8B cells
    cells: [healthbench__med42-8b__bodhi__2026-07, chatdoctor__med42-8b__bodhi__2026-07]
  added-biomistral:
    token: AddedBioMistral
    description: the added BioMistral-7B cells
    cells: [healthbench__biomistral-7b__bodhi__2026-07]

# For each group: per contrast and metric, how many cells move each way, the range of
# the differences, and Holm over the group's cells of the seed-level p-values.
group_contrasts:
  - {contrast: lora - base, metrics: [active_inquiry, rubric_score]}
  - {contrast: lora - base+bodhi, metrics: [active_inquiry]}
  - {contrast: base+bodhi - base, metrics: [rubric_score]}

# Two cells that graded the same base model on the same benchmark with different
# evaluators: rubric scores on the prompts both drew in `seed`.
grader_comparisons:
  - token: PilotGrader
    description: the 2026-04 pilot (rubric graded by the filter grader) against the 2026-05 cell (graded by the evaluator)
    cells: [healthbench__medgemma-27b-text__bodhi__2026-04, healthbench__medgemma-27b-text__bodhi__2026-05]
    seed: 42

# The record of what the discussion posted. Each posted cell name maps to its cell, each
# posted condition and metric to the package's names, and the report lists every posted
# value that the outputs do not reproduce at the posted precision.
posted:
  file: rebuttal/posted_values.json
  conditions: {base: base, base_cot: base+bodhi, lora: lora, lora_cot: lora+bodhi}
  metrics:
    active_inquiry_pct: {metric: active_inquiry, scale: 100, decimals: 1}
    uncertainty_ack: {metric: uncertainty_ack, scale: 1, decimals: 2}
    context_seeking: {metric: context_seeking, scale: 1, decimals: 2}
    red_flag: {metric: red_flag, scale: 1, decimals: 2}
    scope_bounding: {metric: scope_bounding, scale: 1, decimals: 2}
    hedging_quality: {metric: hedging_quality, scale: 1, decimals: 2}
    specificity: {metric: specificity, scale: 1, decimals: 2}
    aggregate: {metric: rubric_score, scale: 1, decimals: 3}
  cells:
    healthbench__medgemma-27b: healthbench__medgemma-27b-text__bodhi__2026-05
    healthbench__mistral-small-24b: healthbench__mistral-small-24b__bodhi__2026-07
    healthbench__med42-8b: healthbench__med42-8b__bodhi__2026-07
    healthbench__biomistral-7b: healthbench__biomistral-7b__bodhi__2026-07
    chatdoctor__mistral-small-24b: chatdoctor__mistral-small-24b__bodhi__2026-07
    chatdoctor__med42-8b: chatdoctor__med42-8b__bodhi__2026-07
    medquad__mistral-small-24b: medquad__mistral-small-24b__bodhi__2026-07
    medqa__mistral-small-24b: medqa-open-preamble__mistral-small-24b__bodhi__2026-07

# The report (bodhi_lora.report; make numbers runs it through scripts/paper_stats.py):
# macros named by each cell's report.token, one table per analyzed cell, and the
# cross-cell table below. Names the tables print:
display:
  weights: {base: Base, lora: LoRA}
  protocols: {bodhi: '\bodhi{}'}
  metrics:
    uncertainty_ack: 'Uncertainty ack.\ (0--2)'
    active_inquiry: 'Active inquiry (\%)'
    context_seeking: 'Context-seeking (0--2)'
    red_flag: 'Red-flag identification (0--2)'
    scope_bounding: 'Scope bounding (0--2)'
    hedging_quality: 'Hedging quality (0--2)'
    specificity: 'Specificity (0--2)'
    red_flag_rate: 'Red-flag rate (\%)'
    rubric_score: 'Aggregate score (0--1)'
    neg_any: 'Harm proxy (\%)'
    chars: 'Reply length (characters)'
    tokens: 'Reply tokens (tokenizer)'
  labels:
    needs-info-theme: 'context-seeking theme'
    emergency-theme: 'emergency-referral theme'

# The cross-cell table of the checks that need no GPU: every cell of cross_cells gets
# every column, "--" where the cell has no such value (for example no label on its
# benchmark). Paths are into each cell's stats.json. A t interval prints as plus or minus
# its half width; a bootstrap interval (ci_style: range) prints both ends, because it need
# not be symmetric. The paper's appendix table of these checks is this table.
#   Red-flag rate outside the emergency theme: the seed-level LoRA - Base test. It counts
#     warranted flags too, so it is not an over-flagging rate (ANALYSIS_PLAN.md section 12,
#     2026-10-10).
#   Asking index: LoRA - Base on the context-seeking theme index, prompt-clustered bootstrap.
#   Format leak: the leak share and count of LoRA+protocol, and the red-flag score of its
#     leaked and clean replies (the protocol's own Pass 1 headers; D11).
#   Askers gap: the rubric score of LoRA replies that ask minus those that do not,
#     prompt-clustered bootstrap; the groups select themselves (W7).
#   Output tokens: the serving engine's count per reply. Only the one-pass conditions have
#     one: the two-pass conditions stored their final reply only.
cross_table:
  - header: '\shortstack[r]{Red-flag rate,\\other themes\\(pp)}'
    value: discrimination.red_flag_rate.emergency-theme.contrasts.lora - base.negative_rate.seed_test.diff
    ci: discrimination.red_flag_rate.emergency-theme.contrasts.lora - base.negative_rate.seed_test.ci95
    scale: 100
    decimals: 1
    sign: true
  - header: '\shortstack[r]{Asking\\index (pp)}'
    value: discrimination.active_inquiry.needs-info-theme.contrasts.lora - base.diff
    ci: discrimination.active_inquiry.needs-info-theme.contrasts.lora - base.diff_ci95
    ci_style: range
    scale: 100
    decimals: 1
    sign: true
  - group: 'Format leak, LoRA+P'
    header: '\shortstack[r]{Share\\(\%)}'
    value: leakage.leak_{protocol}__analysis-format.conditions.lora+{protocol}.leaked_share
    scale: 100
    decimals: 1
  - group: 'Format leak, LoRA+P'
    header: '$n$'
    value: leakage.leak_{protocol}__analysis-format.conditions.lora+{protocol}.n_leaked
    decimals: 0
  - group: 'Format leak, LoRA+P'
    header: '\shortstack[r]{Red flag\\leaked}'
    value: leakage.leak_{protocol}__analysis-format.conditions.lora+{protocol}.dimensions_leaked.red_flag
    decimals: 2
  - group: 'Format leak, LoRA+P'
    header: '\shortstack[r]{Red flag\\clean}'
    value: leakage.leak_{protocol}__analysis-format.conditions.lora+{protocol}.dimensions_clean.red_flag
    decimals: 2
  - header: '\shortstack[r]{Askers gap\\LoRA}'
    value: askers_gap.lora.gap
    ci: askers_gap.lora.gap_ci95
    ci_style: range
    decimals: 3
    sign: true
  - group: 'Output tokens'
    header: Base
    value: cost.conditions.base.tokens_engine_mean
    decimals: 0
  - group: 'Output tokens'
    header: LoRA
    value: cost.conditions.lora.tokens_engine_mean
    decimals: 0
