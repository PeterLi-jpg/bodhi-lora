# The uniform analysis (docs/ARCHITECTURE.md section 7).
#
# python -m bodhi_lora analyze runs the same statistics on every cell; this file only
# names what is not a property of one cell: the text rules, the labels the
# discrimination index uses, the cell groups the paper counts over, and the posted
# values to check. A new label or group is a change here, not in the code. The report
# (python -m bodhi_lora report, not built yet) adds its display names and tables here.

# Cells whose outputs are analyzed when they exist. A cell that never ran (not_run) or
# is only planned has nothing to read.
statuses: [complete, partial, pilot]

# One prompt-clustered bootstrap per cell: every pooled interval of the cell comes from
# the same resamples.
bootstrap: {resamples: 5000, seed: 0}

# Grader-free rules over the reply text. Each becomes a 0/1 column of the response table.
# Patterns ignore case; (?-i:...) makes a part match case.
#   question: the reply has a sentence that ends in "?" and matches `pattern`, after
#             markdown emphasis and quote marks are removed (sentences split at
#             whitespace after . ! ? and at line breaks).
#   mention:  `pattern` matches anywhere in the reply, after markdown emphasis is removed.
text_features:
  second_person_q:
    kind: question
    description: a question put to the reader (a sentence ending in "?" with you, your, yours, yourself or yourselves)
    pattern: '\b(you|your|yours|yourself|yourselves)\b'
  # Post hoc (2026-10-09), for the over-flagging check of commitment C30. It counts every
  # mention: a conditional one ("call 911 if ..."), a negated one and a description of a
  # setting count too. So on prompts with no red flag it is an upper bound on flags
  # raised without cause. The same rule applies to every condition and cell.
  escalation:
    kind: mention
    description: the reply mentions emergency or urgent care (911, a call to 999 or 112, an emergency room, department, service or number, the ER (not ER/PR or a drug's extended-release ER), A&E, urgent care, an ambulance, or immediate, urgent or emergency medical attention)
    pattern: '\b911\b|\b(call|dial|phone|ring)(ing)? (999|112)\b|\bemergency (room|department|services?|care|medical (services|care|help|attention|treatment)|number|help|attention|treatment|evaluation|physician|doctor)\b|\b(the|an|nearest|local|or|to|your) (?-i:ER)\b(?!/)|\bA&E\b|\burgent care\b|\bambulance\b|\b(seek|get|obtain) (immediate|urgent|emergency|prompt) (medical )?(care|attention|help|evaluation|treatment)\b|\b(immediate|urgent) medical (attention|care|help|evaluation|treatment)\b|\bgo (to|straight to) (the )?(nearest )?(hospital|emergency)\b|\bcall (for )?(an ambulance|emergency)\b'

# The discrimination index: P(response | label positive) - P(response | label negative),
# for each listed label whose groups both occur among a cell's evaluated prompts, with the
# rate in each group. Only labels listed here are computed. The physician labels of the
# benchmark records are left out on purpose: the analysis plan keeps them unseen on every
# cell until its adoption (docs/ANALYSIS_PLAN.md, state at registration; convention 3).
#   active_inquiry: does the reply ask more where information is missing (decision D9:
#     both post hoc labellings, side by side).
#   escalation: on the negative group of red-flag-at-stake (prompts with no red flag at
#     issue), the rate is the over-flagging rate of commitment C30.
discrimination:
  - response: active_inquiry
    labels: [needs-info-theme-or-rubric, needs-info-theme]
  - response: escalation
    labels: [red-flag-at-stake]

# Response-length quartile edges come from this condition's scored replies.
length_reference: base

# The cells of the cross-cell statistics, in order.
cross_cells:
  - healthbench__medgemma-27b-text__bodhi__2026-05
  - healthbench__mistral-small-24b__bodhi__2026-07
  - healthbench__med42-8b__bodhi__2026-07
  - healthbench__biomistral-7b__bodhi__2026-07
  - chatdoctor__mistral-small-24b__bodhi__2026-07
  - chatdoctor__med42-8b__bodhi__2026-07
  - medquad__mistral-small-24b__bodhi__2026-07
  - medqa-open-preamble__mistral-small-24b__bodhi__2026-07

# Groups of cells that the paper counts over. A group is the cells of cross_cells that
# match every `where` key, minus `exclude`, or the cells it lists. Keys of where: status
# (list), model (list), family_waiver (true or false), set_aside (true or false). `token`
# names the group in macros.
groups:
  submitted:
    token: Submitted
    description: the cell of the submitted paper
    cells: [healthbench__medgemma-27b-text__bodhi__2026-05]
  set-aside:
    token: SetAside
    description: cells set aside, with the reason in their record
    where: {set_aside: true}
  outside-family:
    token: OutsideFamily
    description: complete cells outside the evaluator's family that are not set aside
    where: {status: [complete], family_waiver: false, set_aside: false}
  added:
    token: Added
    description: the complete cells added in the 2026-07 discussion
    where: {status: [complete]}
    exclude: [healthbench__medgemma-27b-text__bodhi__2026-05]
  added-kept:
    token: AddedKept
    description: the added cells that are not set aside (the Holm family of the aggregate tests)
    where: {status: [complete], set_aside: false}
    exclude: [healthbench__medgemma-27b-text__bodhi__2026-05]
  added-outside-family:
    token: AddedOutsideFamily
    description: the added cells outside the evaluator's family that are not set aside
    where: {status: [complete], family_waiver: false, set_aside: false}
    exclude: [healthbench__medgemma-27b-text__bodhi__2026-05]
  added-mistral:
    token: AddedMistral
    description: the added Mistral-Small-24B cells
    where: {status: [complete], model: [mistral-small-24b]}
  added-med42:
    token: AddedMedFortyTwo
    description: the added Med42-8B cells
    where: {status: [complete], model: [med42-8b]}
  added-biomistral:
    token: AddedBioMistral
    description: the added BioMistral-7B cells
    where: {status: [complete], model: [biomistral-7b]}

# For each group: per contrast and metric, how many cells move each way, the range of
# the differences, and Holm over the group's cells of the seed-level p-values.
group_contrasts:
  - {contrast: lora - base, metrics: [active_inquiry, rubric_score]}
  - {contrast: lora - base+bodhi, metrics: [active_inquiry]}
  - {contrast: base+bodhi - base, metrics: [rubric_score]}

# Two cells that graded the same base model on the same benchmark with different
# evaluators: rubric scores on the prompts both drew in `seed`.
grader_comparisons:
  - token: PilotGrader
    description: the 2026-04 pilot (rubric graded by the filter grader) against the 2026-05 cell (graded by the evaluator)
    cells: [healthbench__medgemma-27b-text__bodhi__2026-04, healthbench__medgemma-27b-text__bodhi__2026-05]
    seed: 42

# The record of what the discussion posted. Each posted cell name maps to its cell, each
# posted condition and metric to the package's names, and the report lists every posted
# value that the outputs do not reproduce at the posted precision.
posted:
  file: rebuttal/posted_values.json
  conditions: {base: base, base_cot: base+bodhi, lora: lora, lora_cot: lora+bodhi}
  metrics:
    active_inquiry_pct: {metric: active_inquiry, scale: 100, decimals: 1}
    uncertainty_ack: {metric: uncertainty_ack, scale: 1, decimals: 2}
    context_seeking: {metric: context_seeking, scale: 1, decimals: 2}
    red_flag: {metric: red_flag, scale: 1, decimals: 2}
    scope_bounding: {metric: scope_bounding, scale: 1, decimals: 2}
    hedging_quality: {metric: hedging_quality, scale: 1, decimals: 2}
    specificity: {metric: specificity, scale: 1, decimals: 2}
    aggregate: {metric: rubric_score, scale: 1, decimals: 3}
  cells:
    healthbench__medgemma-27b: healthbench__medgemma-27b-text__bodhi__2026-05
    healthbench__mistral-small-24b: healthbench__mistral-small-24b__bodhi__2026-07
    healthbench__med42-8b: healthbench__med42-8b__bodhi__2026-07
    healthbench__biomistral-7b: healthbench__biomistral-7b__bodhi__2026-07
    chatdoctor__mistral-small-24b: chatdoctor__mistral-small-24b__bodhi__2026-07
    chatdoctor__med42-8b: chatdoctor__med42-8b__bodhi__2026-07
    medquad__mistral-small-24b: medquad__mistral-small-24b__bodhi__2026-07
    medqa__mistral-small-24b: medqa-open-preamble__mistral-small-24b__bodhi__2026-07

# The report (bodhi_lora.report; make numbers runs it through scripts/paper_stats.py):
# macros named by each cell's report.token, one table per analyzed cell, and the
# cross-cell table below. Names the tables print:
display:
  weights: {base: Base, lora: LoRA}
  protocols: {bodhi: '\bodhi{}'}
  metrics:
    uncertainty_ack: 'Uncertainty ack.\ (0--2)'
    active_inquiry: 'Active inquiry (\%)'
    context_seeking: 'Context-seeking (0--2)'
    red_flag: 'Red-flag identification (0--2)'
    scope_bounding: 'Scope bounding (0--2)'
    hedging_quality: 'Hedging quality (0--2)'
    specificity: 'Specificity (0--2)'
    rubric_score: 'Aggregate score (0--1)'
    neg_any: 'Harm proxy (\%)'
    second_person_q: 'Grader-free question rate (\%)'
    escalation: 'Mentions emergency care (\%)'
    chars: 'Reply length (characters)'
    tokens: 'Reply tokens (tokenizer)'
  labels:
    needs-info-theme-or-rubric: 'needs information (theme or rubric)'
    needs-info-theme: 'needs information (theme)'
    red-flag-at-stake: 'red flag at issue'

# The cross-cell table of the checks that need no GPU: every cell of cross_cells gets
# every column, "--" where the cell has no such value (for example no label on its
# benchmark, or no tokenizer in the local cache). Paths are into each cell's stats.json.
cross_table:
  - group: 'Mentions emergency care on prompts with no red flag (\%, post hoc)'
    header: Base
    value: discrimination.escalation.red-flag-at-stake.conditions.base.negative_rate
    scale: 100
    decimals: 1
  - group: 'Mentions emergency care on prompts with no red flag (\%, post hoc)'
    header: LoRA
    value: discrimination.escalation.red-flag-at-stake.conditions.lora.negative_rate
    scale: 100
    decimals: 1
  - group: 'Mentions emergency care on prompts with no red flag (\%, post hoc)'
    header: 'LoRA $-$ Base'
    value: discrimination.escalation.red-flag-at-stake.contrasts.lora - base.negative_rate.seed_test.diff
    ci: discrimination.escalation.red-flag-at-stake.contrasts.lora - base.negative_rate.seed_test.ci95
    scale: 100
    decimals: 1
    sign: true
  - header: '\shortstack[r]{Asking index, post hoc\\LoRA $-$ Base (pp)}'
    value: discrimination.active_inquiry.needs-info-theme-or-rubric.contrasts.lora - base.diff
    scale: 100
    decimals: 1
    sign: true
  - header: '\shortstack[r]{Format leak\\LoRA+P (\%)}'
    value: leakage.leak_{protocol}__analysis-format.conditions.lora+{protocol}.leaked_share
    scale: 100
    decimals: 1
  - header: '\shortstack[r]{Askers gap\\LoRA}'
    value: askers_gap.lora.gap
    decimals: 3
    sign: true
  - group: 'Tokens per reply'
    header: 'Base+P'
    value: cost.conditions.base+{protocol}.tokens_mean
    decimals: 0
  - group: 'Tokens per reply'
    header: LoRA
    value: cost.conditions.lora.tokens_mean
    decimals: 0
