# The uniform analysis and its report (docs/ARCHITECTURE.md section 7).
#
# python -m bodhi_lora analyze runs the same statistics on every cell, and
# python -m bodhi_lora report (make numbers) turns them into the paper's macros and
# tables. This file only names what is not a property of one cell: the labels the
# discrimination index uses, the cell groups and counts the paper states, the tables it
# prints, and the posted values to check. A new label, group, count or table is a change
# here, not in the code.

# Cells whose outputs are analyzed when they exist. A cell that never ran (not_run) or
# is only planned has nothing to read.
statuses: [complete, partial, pilot]

# One prompt-clustered bootstrap per cell: every pooled interval of the cell comes from
# the same resamples.
bootstrap: {resamples: 5000, seed: 0}

# The level of every count of significant contrasts in the report: the counts below and
# each cell's DimsUp and DimsDown macros (decisions D2 and D7).
alpha: 0.05

# Reply health (post hoc, 2026-10-18; docs/ANALYSIS_PLAN.md section 12): a reply over
# loop_min_chars whose zlib-compressed size is under loop_max_zlib_ratio of its own is a
# repetition loop. In the 2026-07 HealthBench cells, replies over 400 characters
# compress to a median of 0.39 to 0.54 and their 5th percentile stays at 0.24 or above
# outside BioMistral-7B, so 0.15 separates loops from prose. Descriptive; it decides no
# claim. It reports the EOS fault of the training (docs/KNOWN_ISSUES.md, Training).
reply_health: {loop_min_chars: 400, loop_max_zlib_ratio: 0.15}

# No rule here reads the reply text. Until 2026-10-10 two keyword rules did (a
# second-person question rule and an emergency-mention rule); keyword rules miss
# negation, hypotheticals and quotes, so they were removed (docs/CONVENTIONS.md rule 15,
# docs/ANALYSIS_PLAN.md section 12). What a reply does comes from the evaluator's grades:
# active_inquiry for asking and red_flag_rate for red flags. A check by a judge from
# another family is planned, with a semantic rubric and a hand-label gate
# (ANALYSIS_PLAN.md section 12, 2026-10-10). tests/test_no_lexicon.py fails if a
# text rule comes back.

# The discrimination index: P(response | label positive) - P(response | label negative),
# for each listed label whose groups both occur among a cell's evaluated prompts, with the
# rate in each group. Only labels listed here are computed. The physician labels of the
# benchmark records stayed out until the first author adopted the analysis plan on
# 2026-10-11 (docs/ANALYSIS_PLAN.md section 12; convention 3). That adoption let
# `needs-info-physician` in: it is E02, the secondary test of H3 (ANALYSIS_PLAN.md section
# 5.2), read with the F6 family below. The other physician labels wait for the runs whose
# analyses read them (H7 and H11 on the labelled cells).
# The two theme labels read the theme tag only (configs/benchmarks/healthbench.yaml says
# why no other structured field can stand in), and both are post hoc (decision D9).
# `incomplete` is the label of the MediQ paired probe (configs/benchmarks/mediq-paired.yaml):
# it comes from how each pair was built, and its rule pairs the rows, so a cell on that
# benchmark also gets the paired statistics of ANALYSIS_PLAN.md section 5.1 (H3). No cell
# with that benchmark has run.
#   active_inquiry: does the reply ask more on prompts that HealthBench physicians labelled
#     as lacking context, on prompts of the context_seeking theme, or on the incomplete row
#     of a pair than on the complete one.
#   red_flag_rate: the evaluator's red-flag rate (share of replies with red-flag score 2)
#     on prompts of the emergency_referrals theme and on the others. The rate on the
#     others counts warranted flags too, so it is not an over-flagging rate; the test of
#     over-flagging is H7 on the physician labels (ANALYSIS_PLAN.md section 7.2).
discrimination:
  - response: active_inquiry
    labels: [needs-info-physician, needs-info-theme, incomplete]
  - response: red_flag_rate
    labels: [emergency-theme]

# Response-length quartile edges come from this condition's scored replies.
length_reference: base

# The cells of the cross-cell statistics, in order.
cross_cells:
  - healthbench__medgemma-27b-text__bodhi__2026-05
  - healthbench__mistral-small-24b__bodhi__2026-07
  - healthbench__med42-8b__bodhi__2026-07
  - healthbench__biomistral-7b__bodhi__2026-07
  - chatdoctor__mistral-small-24b__bodhi__2026-07
  - chatdoctor__med42-8b__bodhi__2026-07
  - medquad__mistral-small-24b__bodhi__2026-07
  - medqa-open-preamble__mistral-small-24b__bodhi__2026-07

# Cells whose full detail the paper prints: each gets the tables tab_<kind>_<token> of
# bodhi_lora/report/cell.py (conditions, per-seed scores, dimensions, contrasts, counts,
# worst case, disclaimers, bootstrap, axes, length quartiles, themes, gap, tau,
# physician agreement).
detail_cells: [healthbench__medgemma-27b-text__bodhi__2026-05]

# Groups of cells that the paper counts over. A group is the cells of cross_cells that
# match every `where` key, minus `exclude`, or the cells it lists. Keys of where: status
# (list), model (list), family_waiver (true or false), set_aside (true or false). `token`
# names the group in macros. A group defined by a rule takes in every new cell of
# cross_cells that matches it, which is right for a statement about every cell. The
# groups of the cells added in the 2026-07 discussion list their cells, so a cell added
# later cannot change what the paper says about those.
groups:
  submitted:
    token: Submitted
    description: the cell of the submitted paper
    cells: [healthbench__medgemma-27b-text__bodhi__2026-05]
  set-aside:
    token: SetAside
    description: cells set aside, with the reason in their record
    where: {set_aside: true}
  family-waiver:
    token: FamilyWaiver
    description: cells whose base model shares the evaluator's family (D6)
    where: {family_waiver: true}
  outside-family:
    token: OutsideFamily
    description: complete cells outside the evaluator's family that are not set aside
    where: {status: [complete], family_waiver: false, set_aside: false}
  added:
    token: Added
    description: the complete cells added in the 2026-07 discussion
    cells: [healthbench__mistral-small-24b__bodhi__2026-07, healthbench__med42-8b__bodhi__2026-07,
            healthbench__biomistral-7b__bodhi__2026-07, chatdoctor__mistral-small-24b__bodhi__2026-07,
            chatdoctor__med42-8b__bodhi__2026-07, medquad__mistral-small-24b__bodhi__2026-07,
            medqa-open-preamble__mistral-small-24b__bodhi__2026-07]
  added-kept:
    token: AddedKept
    description: the added cells that are not set aside (the Holm family of the aggregate tests)
    cells: [healthbench__mistral-small-24b__bodhi__2026-07, healthbench__med42-8b__bodhi__2026-07,
            healthbench__biomistral-7b__bodhi__2026-07, chatdoctor__mistral-small-24b__bodhi__2026-07,
            chatdoctor__med42-8b__bodhi__2026-07, medquad__mistral-small-24b__bodhi__2026-07]
  added-outside-family:
    token: AddedOutsideFamily
    description: the added cells outside the evaluator's family that are not set aside
    cells: [healthbench__mistral-small-24b__bodhi__2026-07, healthbench__biomistral-7b__bodhi__2026-07,
            chatdoctor__mistral-small-24b__bodhi__2026-07, medquad__mistral-small-24b__bodhi__2026-07]
  added-mistral:
    token: AddedMistral
    description: the added Mistral-Small-24B cells
    cells: [healthbench__mistral-small-24b__bodhi__2026-07, chatdoctor__mistral-small-24b__bodhi__2026-07,
            medquad__mistral-small-24b__bodhi__2026-07, medqa-open-preamble__mistral-small-24b__bodhi__2026-07]
  added-med42:
    token: AddedMedFortyTwo
    description: the added Med42-8B cells
    cells: [healthbench__med42-8b__bodhi__2026-07, chatdoctor__med42-8b__bodhi__2026-07]
  added-biomistral:
    token: AddedBioMistral
    description: the added BioMistral-7B cells
    cells: [healthbench__biomistral-7b__bodhi__2026-07]
  # Family F6 of docs/ANALYSIS_PLAN.md section 2.7 (E02, the secondary test of H3): the
  # existing HealthBench cells outside the waiver. The two Med42-8B cells are reported
  # and marked, outside the family (section 5.2). New HealthBench cells form their own
  # family when they run.
  e02-existing:
    token: PhysicianIndexExisting
    description: the existing HealthBench cells outside the evaluator's family (family F6 of E02)
    cells: [healthbench__medgemma-27b-text__bodhi__2026-05, healthbench__mistral-small-24b__bodhi__2026-07,
            healthbench__biomistral-7b__bodhi__2026-07]

# For each group: per contrast and metric, how many cells move each way, the range of
# the differences, and Holm over the group's cells of the seed-level p-values.
# {protocol} stands for each cell's own protocol id, so a cell on another protocol is
# measured against its own teacher. Its macros say Protocol (e.g. BaseProtocolvsBase).
group_contrasts:
  - {contrast: lora - base, metrics: [active_inquiry, rubric_score]}
  - {contrast: 'lora - base+{protocol}', metrics: [active_inquiry]}
  - {contrast: 'base+{protocol} - base', metrics: [rubric_score]}

# Counts the paper states over a group: the cells where the listed metrics move in the
# given direction in a contrast with p below alpha (test holm: the seven dimensions under
# Holm within the contrast; test p: the paired t). any: at least one of the metrics.
# Each count also gets the number of base models and benchmarks of its cells.
counts:
  - {token: AskRose, group: outside-family, contrast: lora - base, metrics: [active_inquiry, context_seeking],
     direction: up}
  - {token: RedFlagRose, group: outside-family, contrast: lora - base, metrics: [red_flag], direction: up}
  - {token: ScopeRose, group: outside-family, contrast: lora - base, metrics: [scope_bounding], direction: up}
  - {token: DimFell, group: outside-family, contrast: lora - base, direction: down, any: true,
     metrics: [uncertainty_ack, active_inquiry, context_seeking, red_flag, scope_bounding, hedging_quality,
               specificity]}
  # In the added cells every seed evaluated the same prompts, so the seed-level t covers
  # training randomness only; the prompt bootstrap covers prompt sampling (D7).
  - {token: AskRoseBoot, group: outside-family, contrast: lora - base, metrics: [active_inquiry, context_seeking],
     direction: up, test: bootstrap}
  - {token: RedFlagRoseBoot, group: outside-family, contrast: lora - base, metrics: [red_flag], direction: up,
     test: bootstrap}
  - {token: ScopeRoseBoot, group: outside-family, contrast: lora - base, metrics: [scope_bounding], direction: up,
     test: bootstrap}
  - {token: AggregateFell, group: added-outside-family, contrast: lora - base, metrics: [rubric_score],
     direction: down, test: p}
  - {token: AggregateFellBoot, group: added-outside-family, contrast: lora - base, metrics: [rubric_score],
     direction: down, test: bootstrap}
  # What the drop is made of (E05, exploratory): the accuracy axis of the rubric.
  - {token: AccuracyFell, group: added-outside-family, contrast: lora - base, metrics: [axis_accuracy],
     direction: down, test: p}
  # The red-flag drop of the 2026-05 cell under LoRA plus the protocol: a lenient test
  # (unadjusted p) for "the drop repeats", and the Holm test for a rise.
  - {token: RedFlagProtocolFell, group: added-outside-family, contrast: 'lora+{protocol} - lora',
     metrics: [red_flag], direction: down, test: p}
  - {token: RedFlagProtocolRose, group: added-outside-family, contrast: 'lora+{protocol} - lora',
     metrics: [red_flag], direction: up}

# The cells of a group where one condition's mean stands to another's as stated, compared
# at the posted precision when decimals is given.
compares:
  - {token: AtOrAboveTeacher, group: outside-family, metric: active_inquiry, a: lora, b: 'base+{protocol}',
     relation: '>=', scale: 100, decimals: 1}

# The smallest and largest value of one statistic over a group's cells.
ranges:
  # Base is the same model on the same prompts in every seed of the added cells, so its
  # spread across seeds is the run-to-run spread of the evaluation.
  - {token: BaseActiveInquirySD, group: added, value: conditions.active_inquiry.base.seed_sd, scale: 100,
     decimals: 1}

# Correction families across cells (docs/ANALYSIS_PLAN.md section 2.7): Holm over a
# group's cells of one p-value of each cell. The report counts the cells that move each
# way with adjusted p below alpha; a table column reads a cell's adjusted p at
# cross.families.<token>.p_holm.
families:
  # E02 (H3 secondary): LoRA - Base on the physician-label discrimination index, the
  # seed-level paired t (ANALYSIS_PLAN.md section 5.2). "Consistent with calibration" needs
  # a positive difference with adjusted p below 0.05.
  - token: PhysicianIndex
    group: e02-existing
    p: 'discrimination.active_inquiry.needs-info-physician.contrasts.lora - base.seed_test.p'
    diff: 'discrimination.active_inquiry.needs-info-physician.contrasts.lora - base.seed_test.diff'

# Two cells that graded the same base model on the same benchmark with different
# evaluators: rubric scores on the prompts both drew in `seed`.
grader_comparisons:
  - token: PilotGrader
    description: the 2026-04 pilot (rubric graded by the filter grader) against the 2026-05 cell (graded by the evaluator)
    cells: [healthbench__medgemma-27b-text__bodhi__2026-04, healthbench__medgemma-27b-text__bodhi__2026-05]
    seed: 42

# The record of what the discussion posted. Each posted cell name maps to its cell, each
# posted condition and metric to the package's names, and the report lists every posted
# value that the outputs do not reproduce at the posted precision.
posted:
  file: rebuttal/posted_values.json
  conditions: {base: base, base_cot: base+bodhi, lora: lora, lora_cot: lora+bodhi}
  metrics:
    active_inquiry_pct: {metric: active_inquiry, scale: 100, decimals: 1}
    uncertainty_ack: {metric: uncertainty_ack, scale: 1, decimals: 2}
    context_seeking: {metric: context_seeking, scale: 1, decimals: 2}
    red_flag: {metric: red_flag, scale: 1, decimals: 2}
    scope_bounding: {metric: scope_bounding, scale: 1, decimals: 2}
    hedging_quality: {metric: hedging_quality, scale: 1, decimals: 2}
    specificity: {metric: specificity, scale: 1, decimals: 2}
    aggregate: {metric: rubric_score, scale: 1, decimals: 3}
  cells:
    healthbench__medgemma-27b: healthbench__medgemma-27b-text__bodhi__2026-05
    healthbench__mistral-small-24b: healthbench__mistral-small-24b__bodhi__2026-07
    healthbench__med42-8b: healthbench__med42-8b__bodhi__2026-07
    healthbench__biomistral-7b: healthbench__biomistral-7b__bodhi__2026-07
    chatdoctor__mistral-small-24b: chatdoctor__mistral-small-24b__bodhi__2026-07
    chatdoctor__med42-8b: chatdoctor__med42-8b__bodhi__2026-07
    medquad__mistral-small-24b: medquad__mistral-small-24b__bodhi__2026-07
    medqa__mistral-small-24b: medqa-open-preamble__mistral-small-24b__bodhi__2026-07
  # Posted values the paper cites where it withdraws or replaces them (\statPosted<token>).
  cite:
    - {token: ClinicianPrompts, analysis: clinician_identified_prompts, path: count, integer: true}
    - {token: MedQAPreambleAI, analysis: medqa_preamble_run, path: base_active_inquiry_pct, integer: true}
    - {token: SecondPersonBase, analysis: second_person_questions, path: base_pct, decimals: 1}
    - {token: SecondPersonLoRA, analysis: second_person_questions, path: lora_pct, decimals: 1}
    - {token: LeakagePctLoRABodhi, analysis: format_leakage, path: lora_cot_leaked_pct, decimals: 1}
    - {token: DiscriminationBase, analysis: discrimination_index, path: index_pp.base.estimate, decimals: 1,
       sign: true}
    - {token: DiscriminationLoRA, analysis: discrimination_index, path: index_pp.lora.estimate, decimals: 1,
       sign: true}
    - {token: FewerTokensPct, analysis: cost, path: adapter_fewer_output_tokens_pct, integer: true}

# The report (bodhi_lora.report; make numbers runs it): macros named by each cell's
# report.token, one table per analyzed cell, and the tables below. Names the tables print:
display:
  weights: {base: Base, lora: LoRA}
  protocols: {bodhi: '\bodhi{}'}
  metrics:
    uncertainty_ack: 'Uncertainty ack.\ (0--2)'
    active_inquiry: 'Active inquiry (\%)'
    context_seeking: 'Context-seeking (0--2)'
    red_flag: 'Red-flag identification (0--2)'
    scope_bounding: 'Scope bounding (0--2)'
    hedging_quality: 'Hedging quality (0--2)'
    specificity: 'Specificity (0--2)'
    red_flag_rate: 'Red-flag rate (\%)'
    questions: 'Questions per response'
    scope_bounded_rate: 'Scope-bounded rate (\%)'
    specificity_rate: 'Specificity rate (\%)'
    blanket_disclaimer: 'Blanket disclaimer (\%)'
    appropriate_hedging: 'Appropriate hedging (\%)'
    rubric_score: 'Aggregate score (0--1)'
    neg_any: 'Harm proxy (\%)'
    chars: 'Reply length (characters)'
    tokens: 'Reply tokens (tokenizer)'
  labels:
    needs-info-physician: 'physicians: context missing'
    needs-info-theme: 'context-seeking theme'
    emergency-theme: 'emergency-referral theme'
  benchmarks:
    HealthBench-Hard: HB-Hard
    MedQA with the asking preamble: MedQA
  module_order: [q, k, v, o, gate, up, down]

# Tables with one row per cell of cross_cells, every cell with the same columns, "--"
# where a cell has no such value. Paths are into each cell's stats.json; {protocol}
# stands for the cell's protocol id, and {leak_rule} for that protocol's one leak rule.
# A table with blocks must place every cell of cross_cells in a block, or name it in
# leave_out: the report stops otherwise, so a new cell cannot drop out unseen. A t interval prints as plus or minus its half width;
# a bootstrap interval (ci_style: range) prints both ends, because it need not be
# symmetric. star: a p-value; the cell gets a star when it is below alpha.
cross_tables:
  # Table 1 of the paper: the behavior gain and the aggregate cost of every cell.
  tab_cross_cell:
    label_columns: [Benchmark, Base model]
    blocks: [submitted, added-kept, set-aside]
    columns:
      - group: 'Active inquiry (\%)'
        header: Base
        value: conditions.active_inquiry.base.seed_mean
        scale: 100
        decimals: 1
      - group: 'Active inquiry (\%)'
        header: LoRA
        value: conditions.active_inquiry.lora.seed_mean
        scale: 100
        decimals: 1
      - group: 'Active inquiry (\%)'
        header: 'LoRA $-$ Base'
        value: contrasts.lora - base.metrics.active_inquiry.diff
        ci: contrasts.lora - base.metrics.active_inquiry.ci95
        star: contrasts.lora - base.metrics.active_inquiry.p_holm_within_contrast
        scale: 100
        decimals: 1
        sign: true
      - group: 'LoRA $-$ Base'
        header: Context-seeking
        value: contrasts.lora - base.metrics.context_seeking.diff
        ci: contrasts.lora - base.metrics.context_seeking.ci95
        star: contrasts.lora - base.metrics.context_seeking.p_holm_within_contrast
        decimals: 2
        sign: true
      - group: 'LoRA $-$ Base'
        header: '\shortstack[r]{Red-flag\\identification}'
        value: contrasts.lora - base.metrics.red_flag.diff
        ci: contrasts.lora - base.metrics.red_flag.ci95
        star: contrasts.lora - base.metrics.red_flag.p_holm_within_contrast
        decimals: 2
        sign: true
      - group: 'LoRA $-$ Base'
        header: '\shortstack[r]{Scope\\bounding}'
        value: contrasts.lora - base.metrics.scope_bounding.diff
        ci: contrasts.lora - base.metrics.scope_bounding.ci95
        star: contrasts.lora - base.metrics.scope_bounding.p_holm_within_contrast
        decimals: 2
        sign: true
      - group: 'LoRA $-$ Base'
        header: Aggregate
        value: contrasts.lora - base.metrics.rubric_score.diff
        ci: contrasts.lora - base.metrics.rubric_score.ci95
        star: contrasts.lora - base.metrics.rubric_score.p
        decimals: 3
        sign: true
      # The same difference over pooled responses, with the interval of the prompt
      # bootstrap: in the added cells every seed evaluated the same prompts, so the t
      # interval to its left covers training randomness only.
      - group: 'LoRA $-$ Base'
        header: '\shortstack[r]{Aggregate,\\prompt bootstrap}'
        value: contrasts.lora - base.metrics.rubric_score.pooled_diff
        ci: contrasts.lora - base.metrics.rubric_score.diff_ci95
        ci_style: interval
        decimals: 3
        sign: true
  # The filter and training record of each trained cell (Table F.2 of the paper).
  tab_cell_filter:
    label_columns: [Benchmark, Base model]
    blocks: [added-kept, set-aside]
    # Its filter and recipe are in Table F.1 of the paper (trained outside the package).
    leave_out: [healthbench__medgemma-27b-text__bodhi__2026-05]
    skip_missing: true
    columns:
      - {header: '$\tau$', value: filter.recorded.tau, decimals: 1}
      - {header: Graded, value: filter.recorded.graded, format: int}
      - {header: 'Kept (\%)', value: filter.kept_pct_of_graded, decimals: 1}
      - {header: Train, value: filter.recorded.train, format: int}
      - {header: Val, value: filter.recorded.val, format: int}
      - {header: Steps, value: recipe.max_steps, format: int}
      - {header: Epoch, value: recipe.best_epoch_min, upper: recipe.best_epoch_max, format: span}
  # The cross-cell table of the checks that need no GPU: every cell of cross_cells gets
  # every column, "--" where the cell has no such value (for example no label on its
  # benchmark). Paths are into each cell's stats.json. A t interval prints as plus or minus
  # its half width; a bootstrap interval (ci_style: range) prints both ends, because it need
  # not be symmetric. The paper's appendix table of these checks is this table.
  #   Red-flag rate outside the emergency theme: the seed-level LoRA - Base test. It counts
  #     warranted flags too, so it is not an over-flagging rate (ANALYSIS_PLAN.md section 12,
  #     2026-10-10).
  #   Asking index: LoRA - Base on the context-seeking theme index, prompt-clustered bootstrap.
  #   Format leak: the leak share and count of LoRA+protocol, and the red-flag score of its
  #     leaked and clean replies (the protocol's own Pass 1 headers; D11).
  #   Askers gap: the rubric score of LoRA replies that ask minus those that do not,
  #     prompt-clustered bootstrap; the groups select themselves (W7).
  #   Output tokens: the serving engine's count per reply. Only the one-pass conditions have
  #     one: the two-pass conditions stored their final reply only.
  tab_cross_cell_checks:
    columns:
      - header: '\shortstack[r]{Red-flag rate,\\other themes\\(pp)}'
        value: discrimination.red_flag_rate.emergency-theme.contrasts.lora - base.negative_rate.seed_test.diff
        ci: discrimination.red_flag_rate.emergency-theme.contrasts.lora - base.negative_rate.seed_test.ci95
        scale: 100
        decimals: 1
        sign: true
      - header: '\shortstack[r]{Asking\\index (pp)}'
        value: discrimination.active_inquiry.needs-info-theme.contrasts.lora - base.diff
        ci: discrimination.active_inquiry.needs-info-theme.contrasts.lora - base.diff_ci95
        ci_style: range
        scale: 100
        decimals: 1
        sign: true
      - group: 'Format leak, LoRA+P'
        header: '\shortstack[r]{Share\\(\%)}'
        value: leakage.leak_{protocol}__{leak_rule}.conditions.lora+{protocol}.leaked_share
        scale: 100
        decimals: 1
      - group: 'Format leak, LoRA+P'
        header: '$n$'
        value: leakage.leak_{protocol}__{leak_rule}.conditions.lora+{protocol}.n_leaked
        decimals: 0
      - group: 'Format leak, LoRA+P'
        header: '\shortstack[r]{Red flag\\leaked}'
        value: leakage.leak_{protocol}__{leak_rule}.conditions.lora+{protocol}.dimensions_leaked.red_flag
        decimals: 2
      - group: 'Format leak, LoRA+P'
        header: '\shortstack[r]{Red flag\\clean}'
        value: leakage.leak_{protocol}__{leak_rule}.conditions.lora+{protocol}.dimensions_clean.red_flag
        decimals: 2
      - header: '\shortstack[r]{Askers gap\\LoRA}'
        value: askers_gap.lora.gap
        ci: askers_gap.lora.gap_ci95
        ci_style: range
        decimals: 3
        sign: true
      - group: 'Output tokens'
        header: Base
        value: cost.conditions.base.tokens_engine_mean
        decimals: 0
      - group: 'Output tokens'
        header: LoRA
        value: cost.conditions.lora.tokens_engine_mean
        decimals: 0

  # What the aggregate drop is made of (E05; ANALYSIS_PLAN.md section 4, secondary): LoRA -
  # Base on each HealthBench rubric axis, the seed-level paired t, with a star where its
  # Holm-adjusted p over the five axes of the cell is below alpha. On ChatDoctor and MedQuAD
  # the rubric is synthesized (bodhi_lora/data/rubric.py): accuracy is the reference-answer
  # criterion and the two negative criteria. Exploratory: it describes, it decides nothing.
  tab_cross_cell_axes:
    label_columns: [Benchmark, Base model]
    blocks: [submitted, added-kept, set-aside]
    columns:
      - group: 'LoRA $-$ Base, rubric axis'
        header: Accuracy
        value: contrasts.lora - base.metrics.axis_accuracy.diff
        ci: contrasts.lora - base.metrics.axis_accuracy.ci95
        star: contrasts.lora - base.metrics.axis_accuracy.p_holm_axes
        decimals: 3
        sign: true
      - group: 'LoRA $-$ Base, rubric axis'
        header: Completeness
        value: contrasts.lora - base.metrics.axis_completeness.diff
        ci: contrasts.lora - base.metrics.axis_completeness.ci95
        star: contrasts.lora - base.metrics.axis_completeness.p_holm_axes
        decimals: 3
        sign: true
      - group: 'LoRA $-$ Base, rubric axis'
        header: '\shortstack[r]{Communication\\quality}'
        value: contrasts.lora - base.metrics.axis_communication_quality.diff
        ci: contrasts.lora - base.metrics.axis_communication_quality.ci95
        star: contrasts.lora - base.metrics.axis_communication_quality.p_holm_axes
        decimals: 3
        sign: true
      - group: 'LoRA $-$ Base, rubric axis'
        header: '\shortstack[r]{Context\\awareness}'
        value: contrasts.lora - base.metrics.axis_context_awareness.diff
        ci: contrasts.lora - base.metrics.axis_context_awareness.ci95
        star: contrasts.lora - base.metrics.axis_context_awareness.p_holm_axes
        decimals: 3
        sign: true
      - group: 'LoRA $-$ Base, rubric axis'
        header: '\shortstack[r]{Instruction\\following}'
        value: contrasts.lora - base.metrics.axis_instruction_following.diff
        ci: contrasts.lora - base.metrics.axis_instruction_following.ci95
        star: contrasts.lora - base.metrics.axis_instruction_following.p_holm_axes
        decimals: 3
        sign: true
  # The parts of the deployment-risk criterion (E07; ANALYSIS_PLAN.md section 12, the
  # 2026-10-11 adoption: no margins, so intervals only), each LoRA - Base with its seed-level
  # t interval:
  #   Harm proxy (E06): the share of replies that meet at least one negative rubric
  #     criterion, and the points lost to such criteria. LLM-graded, not the physician harm
  #     review (E28). The synthesized rubrics have two negative criteria.
  #   Red-flag identification (0-2), the seven-dimension grade.
  #   Physician-label asking index (E02, H3 secondary): HealthBench cells only; star where
  #     its Holm-adjusted p over family F6 is below alpha.
  # The fourth part, over-flagging on the physician labels (H7), needs the labelled cells
  # (docs/RUN_PLAN.md R4) and has no column until they run.
  tab_cross_cell_risk:
    label_columns: [Benchmark, Base model]
    blocks: [submitted, added-kept, set-aside]
    columns:
      - group: 'Harm proxy (E06)'
        header: '\shortstack[r]{Base\\(\%)}'
        value: conditions.neg_any.base.seed_mean
        scale: 100
        decimals: 1
      - group: 'Harm proxy (E06)'
        header: '\shortstack[r]{LoRA $-$ Base\\(pp)}'
        value: contrasts.lora - base.metrics.neg_any.diff
        ci: contrasts.lora - base.metrics.neg_any.ci95
        star: contrasts.lora - base.metrics.neg_any.p
        scale: 100
        decimals: 1
        sign: true
      - group: 'Harm proxy (E06)'
        header: '\shortstack[r]{Points lost\\LoRA $-$ Base}'
        value: contrasts.lora - base.metrics.neg_points_lost.diff
        ci: contrasts.lora - base.metrics.neg_points_lost.ci95
        star: contrasts.lora - base.metrics.neg_points_lost.p
        decimals: 2
        sign: true
      - header: '\shortstack[r]{Red-flag\\identification}'
        value: contrasts.lora - base.metrics.red_flag.diff
        ci: contrasts.lora - base.metrics.red_flag.ci95
        star: contrasts.lora - base.metrics.red_flag.p_holm_within_contrast
        decimals: 2
        sign: true
      - header: '\shortstack[r]{Physician-label\\asking index (pp)}'
        value: 'discrimination.active_inquiry.needs-info-physician.contrasts.lora - base.seed_test.diff'
        ci: 'discrimination.active_inquiry.needs-info-physician.contrasts.lora - base.seed_test.ci95'
        star: cross.families.PhysicianIndex.p_holm
        scale: 100
        decimals: 1
        sign: true

# Every cell's metrics in the four conditions and two contrasts, a few cells to a table
# (tab_cell_detail_<n>; Appendix I of the paper). The conditions are roles: base+{protocol}
# is each cell's own teacher condition (bodhi_lora/analysis/config.py, CellDetailTables).
cell_detail_tables:
  per_table: 4
  blocks: [submitted, added-kept, set-aside]
  contrasts: [lora - base, 'lora+{protocol} - lora']
  # Blanket disclaimers are a secondary row: an undesired behavior the evaluator flags,
  # outside the Holm family, so its p is the unadjusted paired t.
  metrics: [active_inquiry, uncertainty_ack, context_seeking, red_flag, scope_bounding, hedging_quality,
            specificity, rubric_score, blanket_disclaimer]
