# Where runs read and write. Paths are relative to the repository root.

# One folder per cell, one per seed, one per stage (docs/ARCHITECTURE.md section 6).
results_root: results
# Downloaded and built benchmark files, one folder per benchmark. Ignored by git.
data_root: data/raw
# Stub and dry runs (--stub-engine, --dry-run) write here, one folder per mode, unless
# --results-root names another folder. Ignored by git.
scratch_root: outputs

python:
  # Training: transformers 4.57.6, peft, trl (the train extra of pyproject.toml).
  train: .venv/bin/python
  # Serving and grading: vLLM 0.9.2 needs transformers below 4.54 (requirements-infer.txt).
  infer: .venv-infer/bin/python

vllm_port_base: 8000
