# A BODHI component ablation. No run has used it.
id: bodhi-no-abstention
title: BODHI without section 7, SAFE RECOMMENDATIONS
kind: wrapper
impl: bodhi_llm
package: bodhi-llm==0.1.4
passes: 2
params:
  # Which component to remove from the medical prompt (bodhi_llm.ABLATIONS); none is the
  # full protocol.
  ablate: no_abstention
# The leak rule is a parser of the protocol's own fixed format, not a word list: each
# marker is one of the numbered pass-1 section headers that this record's analysis
# prompt asks the model to write (BodhiLLM.format_fields), matched whole up to a plural
# ending. A reply that repeats two of them has copied the analysis format. No marker is
# a free word; tests/test_no_lexicon.py fails if one is (docs/CONVENTIONS.md rule 15).
leak_rules:
  analysis-format:
    description: two or more of the six pass-1 section headers left when section 7, SAFE
      RECOMMENDATIONS, is removed
    markers:
    - TASK TYPE
    - KEY UNCERTAINT
    - 'RED FLAGS?\s*:'
    - WHAT I THINK
    - QUESTIONS TO ASK
    - 'AUDIENCE\s*:'
    threshold: 2
reference: 'BODHI (bodhi-llm 0.1.4, https://github.com/sebasmos/bodhi-llms): pass 1 writes
  an analysis, pass 2 writes the reply from it; component ablation (EXPERIMENTS.md E26)'
