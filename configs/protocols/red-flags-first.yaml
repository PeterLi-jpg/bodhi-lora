# BODHI with red flags first (EXPERIMENTS.md E17, commitment C31). Pass 1 starts with
# the RED FLAGS section, and pass 2 is asked to state the red flags first. The posted
# diagnosis says LoRA plus BODHI loses red flags because the analysis format leaks into
# the reply; this variant tests whether the order alone recovers them. The instruction
# says nothing about headings, so leakage is not treated at the same time. No run has
# used it yet.
id: red-flags-first
title: BODHI with the red flags first in the analysis and in the reply
kind: wrapper
impl: bodhi_llm
package: bodhi-llm==0.1.4
passes: 2
params:
  ablate: none
  # The pass-1 section moved to the top; the list is renumbered.
  first_section: RED FLAGS
  # Added before the last line of the pass-2 prompt of conversation and emergency replies.
  reply_instruction: >-
    Start the reply with the red flags from your analysis. In one or two plain sentences,
    name the warning signs that need urgent care and say what to do if they occur, or say
    that none apply. Then write the rest of the reply.
# The leak rule is a parser of the protocol's own fixed format, not a word list: each
# marker is one of the numbered pass-1 section headers that this record's analysis
# prompt asks the model to write (BodhiLLM.format_fields), matched whole up to a plural
# ending. A reply that repeats two of them has copied the analysis format. No marker is
# a free word; tests/test_no_lexicon.py fails if one is (docs/CONVENTIONS.md rule 15).
leak_rules:
  analysis-format:
    description: two or more of the seven pass-1 section headers of bodhi-llm 0.1.4, in any order
    markers:
    - TASK TYPE
    - KEY UNCERTAINT
    - SAFE RECOMMENDATION
    - 'RED FLAGS?\s*:'
    - WHAT I THINK
    - QUESTIONS TO ASK
    - 'AUDIENCE\s*:'
    threshold: 2
reference: 'Reviewer LxMF: surface red flags early in the protocol, before the extended
  reasoning (EXPERIMENTS.md E17); built on BODHI (bodhi-llm 0.1.4)'
