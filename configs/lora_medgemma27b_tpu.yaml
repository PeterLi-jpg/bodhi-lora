seed: 42

model:
  name: google/medgemma-27b-text-it
  torch_dtype: bfloat16
  # bitsandbytes (4bit/8bit QLoRA) is CUDA-only and doesn't run on TPU.
  # v6e-8 = 256 GB total HBM — MedGemma-27B (54 GB bfloat16) fits with plenty of room.
  quantization: null

lora:
  # Reduced from r=16 + 7 target_modules (which hung for 7+ hours of XLA
  # compile in our run) to r=8 + 2 targets — proven to compile cleanly
  # in <15 min in a diag run with the rest of the config identical.
  # Trade-off: less expressive LoRA (~12M trainable params vs ~113M).
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - v_proj
  task_type: CAUSAL_LM
  variant: standard

training:
  num_epochs: 5
  # NOTE on v6e-8 + SPMD (num_processes: 1 in tpu/accelerate_config_v6e8.yaml):
  # there's only ONE Python process driving all 8 chips, so per_device_train_
  # batch_size is the batch for the WHOLE 8-chip program, NOT per chip.
  # Effective batch = per_device * grad_accum (no num_processes multiplier).
  #
  # Memory per chip with model sharded 8-ways (~6.75 GB) + activations
  # (replicated, since we don't shard the batch dim):
  #   batch=2, seq=4096  → ~8-12 GB activations with grad-ckpt → fits in 32 GB
  #   batch=4, seq=4096  → ~16-22 GB → tight, risk of OOM
  # Keep batch small, push effective batch up via grad_accum.
  #
  # On non-TPU (multi-GPU), per_device is per-GPU and num_processes scales it.
  # On v6e-8 (256 GB total HBM), batch=2 + grad_accum=32 = effective 64 is
  # the safe configuration.  batch=4 on v6e-8 is "tight, risk of OOM" per
  # original config notes — and may have been silently OOMing Stage 3
  # repeatedly in this run, looking like preemption from the launcher's
  # perspective when the TPU went unreachable.
  # On v6e-16 (512 GB), batch=4 + grad_accum=16 is fine — switch back if
  # you ever get a v6e-16 working.
  # Empirically diagnosed: torch_xla 2.5 + Gemma-3 SPMD + gradient_checkpointing
  # makes first-step compile take 2h+ (or never converge — observed multiple
  # 2-3 hour 0/70 hangs).  A diag run with grad_ckpt=false + seq=1024 + batch=1
  # compiled cleanly in <10 min and started writing GBs to the persistent cache.
  # So: turn grad_ckpt OFF, drop seq to 1024, drop per_device_batch to 1 to
  # keep memory in check without grad_ckpt.
  #
  # Activation memory on v6e-8 with batch=1 seq=1024 27B (sharded 1/8 per chip,
  # bf16, no grad_ckpt): ~3 GB per chip — comfortable in 32 GB HBM.
  # Effective batch stays at 64 via grad_accum=64.
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 64        # effective batch = 64
  learning_rate: 1.0e-4
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  max_seq_length: 1024
  gradient_checkpointing: false
  logging_steps: 5
  save_strategy: epoch
  eval_strategy: epoch
  bf16: true

data:
  train_file: data/sft/train.jsonl
  val_file: data/sft/val.jsonl
  eval_sample_ids: data/raw/hard_200_sample_ids.json
