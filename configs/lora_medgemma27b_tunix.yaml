# Production tunix + qwix LoRA fine-tune of MedGemma-27B (Stage 3, Phase 2).
#
# Mirrors configs/lora_medgemma27b_maxtext.yaml's training semantics so a
# side-by-side run on the same data converges to the same answer. The schema
# matches configs/lora_medgemma27b_tunix_smoke.yaml (the U3 smoke); only the
# hyperparams differ:
#   - num_epochs / gradient_accumulation_steps / max_seq_length match the
#     maxtext production yaml (5 epochs, grad_accum=64, seq_len=2048).
#   - max_steps is unset; production runs by epoch.
#
# Consumed by scripts/train_lora_tunix.py (U2). The launcher (U6) sets
# HF_HOME=/dev/shm/hf, downloads the model snapshot, then invokes the trainer
# with --config <this file> --seed <int> --output-dir <path> per-VM
# (paths.* below get overridden on the CLI).

seed: 42

model:
  name: google/medgemma-27b-text-it
  # Path to a local HF safetensors directory. The HF cache layout is:
  #   ${HF_HOME}/models--<org>--<name>/snapshots/<sha>/
  # The launcher (U6) sets HF_HOME=/dev/shm/hf and downloads via
  # huggingface_hub before calling this script. The trainer (U2) resolves
  # the snapshot dir at runtime via huggingface_hub.snapshot_download(name).
  # Leaving null here means "let U2 resolve it"; setting an absolute path
  # short-circuits the resolver (useful for local CPU testing).
  hf_path: null
  dtype: bfloat16

lora:
  # Same shape as the maxtext production yaml: r=8, alpha=16, target the
  # attention q+kv einsums which are tunix gemma3's equivalent of HF's
  # q_proj/k_proj/v_proj. tunix gemma3 attention uses einsum modules:
  # q_einsum holds the query projection, kv_einsum holds packed k+v. The
  # qwix LoraRule regex U2 builds is r".*/attn/(q_einsum|kv_einsum)" (slash
  # separator, no leaf suffix).
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_einsum
    - kv_einsum

training:
  per_device_batch_size: 1
  # gradient_accumulation_steps tunes BOTH the batch shape that the dummy
  # qwix LoRA trace + train_step JIT see, AND the optax.MultiSteps
  # accumulation count. With per_device=1, the dataloader yields batches
  # of size grad_accum per next() call, and tunix's PeftTrainer feeds
  # each to one train_step call. After grad_accum calls, optax.MultiSteps
  # fires the optimizer update.
  #
  # Effective batch per optimizer step = grad_accum * grad_accum = grad_accum^2.
  # Set to 8 for the NeurIPS 27B run:
  #   - effective batch per opt step = 8 * 8 = 64 examples (healthy for
  #     LoRA on ~30K SFT data; matches HF PEFT defaults)
  #   - dummy trace shape = (8, max_seq_length); on v6e-8 with FSDP=8
  #     each chip sees per-chip batch = 1, which fits 27B + LoRA at
  #     max_seq=1024 in <20 GB/chip activations
  #
  # The previous value of 64 implied an effective batch of 4096 (way
  # over-scoped for a 30K-example SFT, and OOMed at trace time on v6e-8).
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  # max_steps is the count of OPTIMIZER STEPS (not train_step calls).
  # 500 steps at effective batch 64 = 32,000 examples processed across
  # all epochs. The 30K-filtered-rows comment in the prior version was
  # stale: per-seed Qwen-graded data is ~3,100 rows (Stage 2 keeps
  # ~3,100 of 4,000 BODHI traces per seed). 500 steps / (3100 / 64) =
  # ~10.3 effective epochs — solidly in the standard LoRA SFT range
  # (HF PEFT recipes typically do 3-10 epochs). 1500 was 31 epochs,
  # high overfit risk; 500 is conservative-but-defensible.
  #
  # Wall: at observed ~7-13 sec/train_step (with remat=BLOCK), 500 *
  # 8 grad_accum = 4,000 train_step calls = ~8-15 hours per seed
  # (5 seeds in parallel = same wall).
  max_steps: 500
  # eval_interval=100 -> 5 evals during the run (steps 100,200,300,400,
  # 500). At ~2 evals per epoch this gives enough resolution to detect
  # overfit (eval-loss U-shape) and pick the best checkpoint if needed.
  # Was 500 which only fired once at the end -- too coarse to detect
  # overfit in the middle of training.
  eval_interval: 100
  # max_seq_length set to 2048 to capture ~96.3% of training tokens
  # without truncation. v39 measured the actual tokenized response
  # length distribution on real BODHI traces: median 934, mean 1023,
  # max 3144 tokens. Cap-vs-truncation rate:
  #   seq=1024: 43.6% truncated   (too lossy)
  #   seq=1536: 16.1%             (still material)
  #   seq=2048:  3.7%             (chosen — sweet spot)
  #   seq=3072:  0.0%             (no truncation but oversized)
  # The earlier seq=2048 attempts OOMed because tunix-gemma3 ships with
  # RematConfig.NONE (no activation checkpointing) — every one of 62
  # decoder blocks kept its intermediate activations live, busting the
  # 32 GB/chip HBM budget. U2 (scripts/train_lora_tunix.py) now sets
  # ``cfg.remat_config = RematConfig.BLOCK`` unconditionally, which
  # rematerializes the attention block in backward. ~33% per-step
  # compute hit, multi-GB activation savings — enough to fit seq=2048
  # at FSDP=8 + tp=1 + per-chip batch=1 (re-tested under the watchdog,
  # which auto-halves on OOM as a safety net).
  max_seq_length: 2048

data:
  # Output of Stage 3b dataset converter
  # (scripts/convert_traces_to_maxtext.py). The trainer (U2) reads it via
  # scripts/maxtext_lora/dataset_loader.build_iterators(output_format='tunix', ...).
  dataset_dir: data/sft/maxtext

paths:
  # The launcher (U6) passes --output-dir checkpoints/seed_$SEED at invocation
  # time; the trainer (U2) appends '/orbax' to it when this YAML key isn't
  # set. Set explicitly here for local CPU testing only. Use <N> as a seed
  # placeholder (the trainer substitutes it) for multi-seed launches.
  checkpoint_root_directory: checkpoints/seed_<N>/orbax
