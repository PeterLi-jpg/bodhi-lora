# Rebuttal branch — 2nd new base model: Gemma-2-9B-it (general, capable).
# Replaces BioMistral-7B, which was too weak an instruction-follower for the CoT
# protocol (the wrapper itself couldn't elicit the behavior, so nothing distilled).
# Gemma-2-9B-it is a strong general instruct model, clean family vs the Qwen filter
# and Llama evaluator, and should reproduce the internalization effect like
# Mistral-Small-24B did. Gemma chat template exposes a clean assistant header
# (<start_of_turn>model), so completion-masking auto-detects it (no response_template).
#
# 9B in bf16 (~18 GB) -> full-precision LoRA fits comfortably on one H100 80GB.

seed: 42

model:
  name: google/gemma-2-9b-it
  torch_dtype: bfloat16
  quantization: null

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  task_type: CAUSAL_LM
  variant: standard

training:
  num_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4    # effective batch = 16 (matches the paper)
  learning_rate: 1.0e-4
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  max_seq_length: 4096
  logging_steps: 10
  save_strategy: epoch
  eval_strategy: epoch
  bf16: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false

data:
  # Gemma template auto-detects the response template; no override needed.
  train_file: data/sft/train.jsonl
  val_file: data/sft/val.jsonl
  eval_sample_ids: data/raw/hard_200_sample_ids.json
