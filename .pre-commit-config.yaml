# Pre-commit hooks for this repo (issue #22). The commit-msg and pre-push hooks
# live in hooks/ and are activated with `git config core.hooksPath hooks`.
#
# Install once per clone:
#   pip install pre-commit
#   pre-commit install
#
# Then `git commit` will run the hooks below before each commit.  CI
# (.github/workflows/ci.yml) runs the same checks server-side so a missing
# local install can't sneak past review.

repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Some hand-edited configs/lora_*.yaml use anchors or multi-doc
        # separators that check-yaml rejects, so configs/ is skipped here.
        # CI loads every config with yaml.safe_load instead.
        exclude: ^configs/.*\.yaml$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]   # block adding a 27B checkpoint by accident

  - repo: local
    hooks:
      - id: no-secrets
        name: scan tracked files for HF / OpenAI / AWS tokens
        entry: bash scripts/check_no_secrets.sh
        language: system
        pass_filenames: false
        # Run on every commit, even if no sensitive file is staged: the
        # script scans every tracked file.
        always_run: true

      - id: doc-paths
        name: every repo path named in the docs exists
        entry: python scripts/check_doc_paths.py
        language: system
        pass_filenames: false
        files: \.md$
