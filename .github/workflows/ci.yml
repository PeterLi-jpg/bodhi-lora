name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['*']

# Cancel older runs on the same ref when new commits arrive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # check_doc_paths.py verifies <commit>:<path> references in history notes.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Dev tools (pytest etc.) live in requirements-dev.txt. Install
          # those first so the rest of this step can rely on pip-resolver
          # state being primed.
          python -m pip install -r requirements-dev.txt
          # CPU subset of the ML stack so importorskip(torch/transformers/peft)
          # paths actually run in CI instead of silently skipping.
          # Excludes torch_xla, jax[tpu], autoawq, bitsandbytes (GPU/TPU only).
          # bodhi-llm[all] is needed by test_bodhi_ablation.py; the [all]
          # extra only adds openai, no torch/transformers churn.
          # trl (pinned as in requirements.txt, with the rich it imports but does
          # not declare) and scikit-learn let test_pipeline_train_manifest.py and
          # the sklearn kappa check in test_stats_irr_kappa.py run instead of skipping.
          python -m pip install \
            "torch==2.7.0" \
            "transformers==4.57.6" \
            "peft==0.19.1" \
            "trl==0.11.4" \
            "rich>=13.0,<15.0" \
            "scikit-learn>=1.3,<2" \
            "safetensors" \
            "datasets>=2.18.0,<4.0.0" \
            "bodhi-llm[all]==0.1.4"

      - name: Compile Python sources
        run: python -m py_compile scripts/*.py scripts/maintenance/*.py

      - name: Check repo hygiene
        run: |
          bash scripts/check_no_secrets.sh
          python scripts/check_doc_paths.py

      - name: Validate YAML configs
        run: |
          python - <<'EOF'
          from pathlib import Path
          import yaml

          for path in Path("configs").glob("*.yaml"):
              with open(path) as handle:
                  yaml.safe_load(handle)
          EOF

      # A clean checkout must rebuild every committed paper number (audit REPRO-6).
      # HealthBench is the one input not in git; download_data.py fetches it from
      # OpenAI's public bucket, as setup.sh does.
      - name: Rebuild the paper numbers from the checkout
        run: |
          python scripts/download_data.py
          make numbers
          git diff --exit-code paper/generated
          python scripts/check_paper_macros.py

      - name: Run tests
        run: |
          if [ -d tests ]; then
            python -m pytest tests/
          else
            echo "tests/ not present; skipping pytest"
          fi
