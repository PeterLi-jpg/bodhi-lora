name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['*']

# Cancel older runs on the same ref when new commits arrive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU subset of the ML stack so importorskip(torch/transformers/peft)
          # paths actually run instead of silently skipping.
          # Excludes torch_xla, jax[tpu], autoawq, bitsandbytes (GPU/TPU only).
          python -m pip install \
            "pyyaml>=6.0" \
            "numpy>=1.24,<3.0" \
            "torch==2.7.0" \
            "transformers==4.57.6" \
            "peft==0.19.1" \
            "safetensors" \
            "datasets>=2.18.0,<4.0.0" \
            "bodhi-llm==0.1.4"
          # requirements-dev.txt may not exist yet on this branch; fall back to pytest only.
          python -m pip install -r requirements-dev.txt 2>/dev/null || python -m pip install pytest

      - name: Compile Python sources
        run: python -m py_compile scripts/*.py

      - name: Validate YAML configs
        run: |
          python - <<'EOF'
          from pathlib import Path
          import yaml

          for path in Path("configs").glob("*.yaml"):
              with open(path) as handle:
                  yaml.safe_load(handle)
          EOF

      - name: Run tests
        run: |
          if [ -d tests ]; then
            python -m pytest tests/
          else
            echo "tests/ not present; skipping pytest"
          fi
