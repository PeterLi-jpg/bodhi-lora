# The twin of the clinician-question cells (EXPERIMENTS.md E19): the smoke cell's
# adapters on rows with no rubric.
id: tiny-questions__tiny-random-llama__bodhi
benchmark: tiny-questions
model: tiny-random-llama
protocol: bodhi
seeds: [1]
adapters_from: tiny-rubric__tiny-random-llama__bodhi
grading:
  filter: qwen2.5-14b
  evaluator: llama-3.1-8b
  judges: [medgemma-27b-text]
