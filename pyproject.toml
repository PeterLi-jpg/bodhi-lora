# The training and analysis environment (.venv). Install it editable from the repo root:
#   pip install -e '.[dev]'                 analysis, report, figures and tests (CPU; the tests
#                                           that need the training stack skip)
#   pip install -e '.[train,gpu,dev]'       also the training stack and python -m bodhi_lora run
#                                           (setup.sh does this)
# Install it editable, never as a wheel: bodhi_lora/paths.py finds configs/ and results/
# next to the package folder, so a copy in site-packages finds neither.
#
# vLLM serving (probe, traces, filter, eval, grade, bench) runs in a second environment
# from requirements-infer.txt, because vLLM 0.10.2 pins its own torch (2.8.0) and runs with
# transformers 4.56.2, and the train extra pins torch 2.7.0 and transformers 4.57.6 (that
# file says which env ran which cell).

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhi-lora"
version = "0.1.0"
description = "Distill a teaching protocol's clinical epistemic behaviors into LoRA adapters, and measure them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
# What the analysis, the report and the figures need (make analyze, numbers, figures).
dependencies = [
    "pyyaml>=6.0,<7.0",
    # The registry schema (bodhi_lora/registry/schema.py). The inference env needs
    # pydantic>=2.11.7 for vLLM 0.10.2 (requirements-infer.txt).
    "pydantic>=2.10,<3",
    "numpy>=1.24,<3.0",
    # The committed stats.json files were written with pandas 3.0.3, and
    # tests/test_analysis_committed.py checks them byte for byte.
    "pandas>=2.0,<4.0",
    "scipy>=1.11,<2.0",
    "statsmodels>=0.14,<0.15",
    "matplotlib>=3.7,<4.0",
    # compute_irr_kappa.py and the physician sheet tools read and write .xlsx.
    "openpyxl>=3.1,<4.0",
    "tqdm>=4.65",
    # python -m bodhi_lora fetch builds some benchmarks with datasets; make extract counts
    # reply tokens with the cached tokenizer (huggingface-hub, tokenizers).
    "datasets>=2.18.0,<4.0.0",
    "huggingface-hub",
    "tokenizers>=0.19",
]

[project.optional-dependencies]
# Training (bodhi_lora/pipeline/train.py) and the CPU smoke run (make smoke). Exact pins:
# the code works around shape bugs in transformers DynamicLayer and API drift in trl
# SFTTrainer, and a patch release between runs can break either. These are the versions of
# the GPU host's training env, which trained the 2026-07 and 2026-10 adapters. The
# inference env has torch 2.8.0, which vLLM 0.10.2 pins; it loads the adapters as files.
train = [
    "torch==2.7.0",
    "transformers==4.57.6",
    "peft==0.19.1",
    "trl==0.11.4",
    "accelerate==1.13.0",
    # trl imports rich at run time but does not declare it at this version.
    "rich>=13.0,<15.0",
    # The BODHI two-pass prompt (bodhi_lora/protocols/bodhi_llm.py).
    "bodhi-llm[all]==0.1.4",
    # transformers builds the vision tower of the multimodal Gemma 3 records even on the
    # text path, and that needs timm and Pillow.
    "timm>=1.0.0,<2.0.0",
    "pillow>=10.0,<12.0",
]
# CUDA only, so a Mac or a CPU runner skips them: autoawq for AWQ bases, bitsandbytes for
# QLoRA cells (model.quantization "4bit" or "8bit").
gpu = [
    "autoawq>=0.2.0,<0.3.0; sys_platform == 'linux'",
    "bitsandbytes>=0.43,<0.48; sys_platform == 'linux'",
]
dev = [
    "pytest>=7.0",
    # The sklearn cross-check of the kappa in tests/test_stats_irr_kappa.py.
    "scikit-learn>=1.3,<2",
]

[project.scripts]
bodhi-lora = "bodhi_lora.cli:main"

[project.urls]
Repository = "https://github.com/PeterLi-jpg/bohdi-lora"

# Only the package. scripts/, tests/ and legacy/ also look like packages to the flat-layout
# discovery, which then refuses to build.
[tool.setuptools.packages.find]
include = ["bodhi_lora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
